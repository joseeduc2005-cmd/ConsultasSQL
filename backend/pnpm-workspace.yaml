allowBuilds:
  # Dependencia transitiva de las herramientas de linting. Su script nativo no hace
  # falta: eslint funciona sin el, comprobado.
  unrs-resolver: false
# pnpm 10+/11 lee la aprobación de build scripts desde este archivo.
# oracledb necesita su script de instalación; el resto son módulos nativos opcionales.
onlyBuiltDependencies:
  - oracledb
  - unrs-resolver
  - esbuild
  - sharp
