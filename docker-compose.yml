# ═══════════════════════════════════════════════════════════════════
#  PRACTICASPREPROFESIONALES — Motor SQL Multi-DB con IA
#
#  Servicios:
#    postgres  → PostgreSQL 16  (base primaria del sistema: knowledge_base)
#    ollama    → IA local deepseek-coder
#    backend   → API Express Node.js 20
#    frontend  → Next.js 15
#
#  Uso:
#    docker compose up -d
#
#  Puertos expuestos:
#    3000  → Frontend
#    3002  → Backend API
#    5432  → PostgreSQL
#   11434  → Ollama
# ═══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 16 (knowledge_base — base interna del sistema) ─────
  postgres:
    image: postgres:16-alpine
    container_name: practicas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Ollama (IA local) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: practicas-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Cargar modelo la primera vez:
    #   docker exec -it practicas-ollama ollama pull deepseek-coder

  # ── Backend (Express API) ─────────────────────────────────────────
  backend:
    image: consultas-sql-backend:pruebas
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practicas-backend
    restart: unless-stopped
    network_mode: host        # usa red del host → accede a IPs externas y VPN
    env_file:
      - ${BACKEND_ENV_PATH:-./backend/.env}
    environment:
      - OLLAMA_URL=http://localhost:11434/api/generate
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002,http://172.20.91.3:3000,http://172.20.91.3:3002
      - DATABASE_URL=postgres://postgres:admin123@localhost:5432/knowledge_base
    volumes:
      - ./backend/config/multidb.databases.json:/app/config/multidb.databases.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    image: consultas-sql-frontend:pruebas
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: practicas-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # permite llegar al backend en host network
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://172.20.91.3:3002
      - BACKEND_URL=http://host.docker.internal:3002
    depends_on:
      - backend
    ports:
      - "3000:3000"

# ── Volúmenes persistentes ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  default:
    driver: bridge
