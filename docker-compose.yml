# ═══════════════════════════════════════════════════════════════════
#  PRACTICASPREPROFESIONALES — Motor SQL Multi-DB con IA
#
#  Servicios:
#    postgres  → PostgreSQL 16  (base primaria del sistema: knowledge_base)
#    backend   → API Express Node.js 20
#    frontend  → Next.js 15
#
#  Uso:
#    docker compose up -d
#
#  Puertos expuestos:
#    3000  → Frontend
#    3002  → Backend API
#    5432  → PostgreSQL
# ═══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 16 (knowledge_base — base interna del sistema) ─────
  postgres:
    image: postgres:16-alpine
    container_name: practicas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en el .env de la raiz}
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Carga automática del esquema + datos actuales de knowledge_base.
      # Los scripts de /docker-entrypoint-initdb.d/ se ejecutan SOLO la primera
      # vez (volumen vacío) → en un servidor nuevo la BD arranca ya poblada.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Express API) ─────────────────────────────────────────
  backend:
    image: consultas-sql-backend:pruebas
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practicas-backend
    restart: unless-stopped
    network_mode: host        # usa red del host → accede a IPs externas y VPN
    env_file:
      - ${BACKEND_ENV_PATH:-./backend/.env}
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002,http://172.20.91.3:3000,http://172.20.91.3:3002
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en el .env de la raiz}@localhost:5432/knowledge_base
      - MULTI_DB_CONFIG_FILE=/app/config/multidb.databases.json
      - SKIP_DB_INIT=true
    volumes:
      - ./backend/config/multidb.databases.json:/app/config/multidb.databases.json:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 8s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    image: consultas-sql-frontend:pruebas
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: practicas-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # resuelve al gateway del bridge → backend en host network
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://172.20.91.3:3002
      - BACKEND_URL=http://host.docker.internal:3002
      # La ruta /api/repair del frontend conecta directo a PostgreSQL.
      # frontend y postgres comparten la red bridge → se resuelve por nombre de servicio.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en el .env de la raiz}@postgres:5432/knowledge_base
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ── Respaldo de la base de conocimiento ───────────────────────────
  #
  # Lo que la gente va escribiendo aqui no se puede regenerar: son los casos que
  # resolvieron, con sus scripts. Habia un restore.sh, pero ese script siembra un
  # contenedor nuevo; no es una copia de seguridad. Esto si lo es.
  #
  # Saca una copia al arrancar y luego cada RESPALDO_CADA_HORAS, y conserva las
  # ultimas RESPALDO_CONSERVAR. Las copias van a ./respaldos del host, no a un
  # volumen de Docker, para que se puedan llevar a otra maquina sin Docker de por
  # medio.
  #
  # Para restaurar una:
  #   docker compose exec -T postgres pg_restore -U postgres -d knowledge_base \
  #     --clean --if-exists < respaldos/knowledge_base-AAAAMMDD-HHMMSS.dump
  db-backup:
    image: postgres:16-alpine
    container_name: practicas-respaldo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en el .env de la raiz}
      CADA_HORAS: ${RESPALDO_CADA_HORAS:-24}
      CONSERVAR: ${RESPALDO_CONSERVAR:-14}
    volumes:
      - ./respaldos:/respaldos
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        echo "[respaldo] cada $${CADA_HORAS}h, conservando $${CONSERVAR} copias"
        while true; do
          f="/respaldos/knowledge_base-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -h postgres -U postgres -d knowledge_base -Fc -f "$$f"; then
            echo "[respaldo] ok $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "[respaldo] FALLO al escribir $$f"
            rm -f "$$f"
          fi
          # Borra las mas viejas, dejando las ultimas CONSERVAR.
          ls -1t /respaldos/knowledge_base-*.dump 2>/dev/null \
            | tail -n +$$((CONSERVAR + 1)) | xargs -r rm -f
          sleep $$((CADA_HORAS * 3600))
        done

# ── Volúmenes persistentes ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  default:
    driver: bridge
