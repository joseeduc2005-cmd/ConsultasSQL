# ═══════════════════════════════════════════════════════════════════
#  PRACTICASPREPROFESIONALES — Motor SQL Multi-DB con IA
#
#  Servicios:
#    postgres  → PostgreSQL 15
#    oracle    → Oracle XE 21c  (gvenzl/oracle-xe imagen ligera)
#    ollama    → IA local deepseek-coder
#    backend   → API Express Node.js 20
#    frontend  → Next.js 15
#
#  Uso:
#    1. docker compose up --build
#    2. (primera vez, esperar ~3 min a Oracle) luego:
#       docker exec -it practicas-ollama ollama pull deepseek-coder
#
#  Puertos expuestos:
#    3000 → Frontend
#    3002 → Backend API
#    5432 → PostgreSQL
#    1521 → Oracle
#   11434 → Ollama
# ═══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 15 ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: practicas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./knowledge_base.backup:/backup/knowledge_base.backup:ro
      - ./restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  

  # ── Ollama (IA local) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: practicas-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Cargar modelo la primera vez:
    #   docker exec -it practicas-ollama ollama pull deepseek-coder

  # ── Backend (Express API) ─────────────────────────────────────────
  backend:
    image: consultas-sql-backend:pruebas
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practicas-backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_PATH:-./backend/.env}
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002,http://172.20.91.3:3000,http://172.20.91.3:3002
      - DATABASE_URL=postgres://postgres:admin123@postgres:5432/knowledge_base
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "3002:3002"

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    image: consultas-sql-frontend:pruebas
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: practicas-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:3002
      - BACKEND_URL=http://backend:3002
    depends_on:
      - backend
    ports:
      - "3000:3000"

# ── Volúmenes persistentes ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  oracle_data:
    driver: local
  ollama_data:
    driver: local

networks:
  default:
    driver: bridge